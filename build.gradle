plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.41.0")
    testImplementation("org.testng:testng:7.10.2")
    testImplementation("io.github.cdimascio:dotenv-java:3.0.0")
}

test {
    useTestNG {
        // Agrupa los métodos por instancia (clase). Evita que TestNG intercale
        // clases a causa de los dependsOnMethods: así cada navegador se abre y
        // se cierra mientras corre su propia clase, uno a la vez.
        groupByInstances = true
    }
    // Imprime el stacktrace completo de cada test que falla — útil en CI.
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces true
        showCauses true
        showExceptions true
    }
    // Al terminar, abre el reporte funnel en el navegador (solo Windows).
    finalizedBy 'abrirReporteFunnel'
}

task abrirReporteFunnel(type: Exec) {
    description = 'Abre el reporte funnel en el navegador al terminar las pruebas.'
    def reporte = file('build/reports/tests/test/reporte-funnel.html')
    onlyIf { reporte.exists() }
    commandLine 'powershell', '-NoProfile', '-Command', "Start-Process '${reporte.absolutePath}'"
    ignoreExitValue = true
}
plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation("org.seleniumhq.selenium:selenium-java:4.41.0")
    testImplementation("org.testng:testng:7.10.2")
    testImplementation("io.github.cdimascio:dotenv-java:3.0.0")
}

test {
    useTestNG()
}